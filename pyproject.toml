[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cinch"
version = "1.0.0"
description = "MCP server + cross-harness skills for building and operating AI agents safely"
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.10"
authors = [{name = "Cinch Contributors"}]
keywords = ["ai", "security", "mcp", "nist", "cisa", "owasp", "agent", "harness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Runtime deps: MCP SDK 2.0 (high-level MCPServer API) + YAML loader.
    "mcp>=2.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
cinch = "cinch.server:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cinch"]

[tool.ruff]
line-length = 100
target-version = "py310"