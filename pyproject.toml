[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cinch-ai-security"
version = "1.1.1"
description = "MCP server + cross-harness skills for building and operating AI agents safely"
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.10"
authors = [{name = "Cinch Contributors"}]
keywords = ["ai", "security", "mcp", "nist", "cisa", "owasp", "agent", "harness", "supply-chain", "red-team", "custody", "lasm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Runtime deps: MCP SDK 2.0 (high-level MCPServer API) + YAML loader.
    # Upper bounds guard against an incompatible major release being pulled
    # silently (defense-in-depth alongside a future lockfile).
    "mcp>=2.0.0,<3",
    "pyyaml>=6.0,<7",
]

[project.urls]
Homepage = "https://nirhalfon.github.io/cinch-ai-security/"
Repository = "https://github.com/nirhalfon/cinch-ai-security"
Documentation = "https://nirhalfon.github.io/cinch-ai-security/"
Issues = "https://github.com/nirhalfon/cinch-ai-security/issues"
Changelog = "https://github.com/nirhalfon/cinch-ai-security/commits/main"

[project.scripts]
cinch = "cinch.server:main"

[project.optional-dependencies]
# dev includes the security tooling (bandit, pip-audit) so CI installs one
# pinned set via `pip install -e ".[dev]"` instead of ad-hoc unpinned installs.
dev = ["pytest>=8.0,<10", "ruff>=0.1,<1", "bandit>=1.7,<2", "pip-audit>=2.7,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/cinch"]

# Bundle the data dirs into the wheel so a pip-installed `cinch` finds its
# checklists/mappings/protocols at runtime (loader resolves cinch/data/ first).
[tool.hatch.build.targets.wheel.force-include]
"checklists" = "cinch/data/checklists"
"mappings" = "cinch/data/mappings"
"protocols" = "cinch/data/protocols"
# Ship the assessment console so `cinch console` works from a pip install, not
# just from a checkout.
"docs-site/index.html" = "cinch/data/console/index.html"
"docs-site/data/full.json" = "cinch/data/console/data/full.json"
"docs-site/data/rubric.json" = "cinch/data/console/data/rubric.json"
"docs-site/data/assessment.json" = "cinch/data/console/data/assessment.json"

[tool.ruff]
line-length = 100
target-version = "py310"