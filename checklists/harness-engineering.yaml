# Harness Engineering Checklist
# Validates AI harness design, configuration, and operational safety


metadata:
  id: harness-engineering
  name: Harness Engineering Checklist
  version: 1.0.0
  description: 'Validates AI harness design, configuration, and operational safety. Covers architecture,
    prompt engineering, tool boundaries, runtime controls, and observability.

    '
  categories:
  - id: architecture
    name: Architecture & Design
    weight: 25
  - id: prompt-engineering
    name: Prompt Engineering
    weight: 25
  - id: tool-boundaries
    name: Tool & Capability Boundaries
    weight: 20
  - id: runtime-controls
    name: Runtime Controls & Limits
    weight: 15
  - id: observability
    name: Observability & Monitoring
    weight: 15
checklist:

  # ── Architecture & Design ──────────────────────────────────────

  - id: HE-001
    category: architecture
    threat: Least-privilege principle enforced in harness design
    control: The harness must grant only the minimum capabilities required for the intended task. No broad
      or unrestricted access to system resources.
    severity: critical
    verification: 'manual_review — evidence required: Architecture diagram and capability mapping document'
    sources:
    - OWASP ASVS v4.2 — V1 Architecture
    - NIST SP 800-53 — AC-6 Least Privilege

  - id: HE-002
    category: architecture
    threat: Threat model documented for harness and agent interactions
    control: A threat model (STRIDE or similar) must exist covering the harness, agent, tool interfaces, and
      data flows. It must be reviewed at each major release.
    severity: critical
    verification: 'manual_review — evidence required: Threat model document with identified threats and mitigations'
    sources:
    - STRIDE threat modeling framework
    - Microsoft SDL threat modeling

  - id: HE-003
    category: architecture
    threat: Sandbox or container isolation for agent execution
    control: Agent workloads must execute within isolated containers, VMs, or sandboxed environments. Host
      system access must be mediated and restricted.
    severity: high
    verification: 'automated — evidence required: Container runtime configuration and isolation policy'
    sources:
    - CIS Docker Benchmark
    - NIST SP 800-53 — SC-3 Security Function Isolation

  - id: HE-004
    category: architecture
    threat: Network egress restrictions enforced on agent environments
    control: Agent containers must have network policies that restrict outbound connections to only approved
      endpoints. Default-deny egress is required.
    severity: high
    verification: 'automated — evidence required: Network policy manifests and egress allow-list'
    sources:
    - Kubernetes NetworkPolicy documentation
    - NIST SP 800-53 — SC-7 Boundary Protection

  - id: HE-005
    category: architecture
    threat: Secrets management separates credentials from configuration
    control: API keys, tokens, and other secrets must not appear in configuration files, environment variables
      in plaintext, or source code. A secrets manager or vault must be used.
    severity: high
    verification: 'automated — evidence required: Secrets management configuration and scan results showing
      no hardcoded secrets'
    sources:
    - OWASP Top 10 — A02 Cryptographic Failures
    - HashiCorp Vault documentation


  # ── Prompt Engineering ──────────────────────────────────────

  - id: HE-006
    category: prompt-engineering
    threat: System prompts include behavioral constraints and refusal policies
    control: System prompts must explicitly define what the agent must NOT do, including refusal policies
      for harmful, unethical, or out-of-scope requests. Constraints must be specific and unambiguous.
    severity: critical
    verification: 'manual_review — evidence required: System prompt document with marked constraint sections'
    sources:
    - OWASP LLM Top 10 — LLM01 Prompt Injection
    - NIST AI RMF — GOVERN 1.2

  - id: HE-007
    category: prompt-engineering
    threat: Prompt injection defenses implemented at multiple layers
    control: Defense-in-depth against prompt injection must include input sanitization, output filtering,
      and structural separation between instructions and user data. No single bypass should compromise the
      system.
    severity: critical
    verification: 'hybrid — evidence required: Defense layer diagram and red-team test results'
    sources:
    - OWASP LLM Top 10 — LLM01 Prompt Injection
    - 'SimPromptons: Prompt injection simulation framework'

  - id: HE-008
    category: prompt-engineering
    threat: Role and persona boundaries prevent privilege escalation
    control: The agent must not be instructed to act as a system administrator, root user, or other privileged
      entity. Role definitions must scope authority to the task domain only.
    severity: high
    verification: 'manual_review — evidence required: System prompt review and role boundary documentation'
    sources:
    - OWASP LLM Top 10 — LLM06 Excessive Agency
    - NIST SP 800-53 — AC-2 Account Management

  - id: HE-009
    category: prompt-engineering
    threat: Instruction and data channels are structurally separated
    control: User-provided data must be distinguished from system instructions using delimiters, tags, or
      separate message roles. The agent must treat data as untrusted content, not as commands.
    severity: high
    verification: 'manual_review — evidence required: Prompt template showing structural separation'
    sources:
    - OWASP LLM Top 10 — LLM01 Prompt Injection
    - LangChain prompt template best practices

  - id: HE-010
    category: prompt-engineering
    threat: Output validation prevents agent from emitting harmful content
    control: All agent outputs destined for end users must pass through an output filter that blocks PII leaks,
      code execution, and harmful content.
    severity: medium
    verification: 'automated — evidence required: Output filter configuration and test suite results'
    sources:
    - OWASP LLM Top 10 — LLM02 Insecure Output Handling


  # ── Tool & Capability Boundaries ──────────────────────────────────────

  - id: HE-011
    category: tool-boundaries
    threat: Tool allow-list restricts agent to approved operations only
    control: The harness must enumerate every tool, API, or capability the agent may access. Any tool not
      on the allow-list must be inaccessible at runtime.
    severity: critical
    verification: 'automated — evidence required: Tool allow-list configuration and runtime enforcement logs'
    sources:
    - OWASP LLM Top 10 — LLM06 Excessive Agency
    - NIST SP 800-53 — AC-3 Access Enforcement

  - id: HE-012
    category: tool-boundaries
    threat: Destructive operations require explicit human approval
    control: Any tool call that deletes data, modifies infrastructure, or sends communications externally
      must require a human-in-the-loop confirmation before execution.
    severity: critical
    verification: 'manual_review — evidence required: Approval workflow configuration and audit logs'
    sources:
    - NIST SP 800-53 — AC-3 Access Enforcement
    - OWASP LLM Top 10 — LLM06 Excessive Agency

  - id: HE-013
    category: tool-boundaries
    threat: Tool schemas validate all inputs before execution
    control: Every tool must declare a JSON schema for its inputs. The harness must reject calls with missing,
      extra, or wrongly-typed parameters before invoking the tool.
    severity: high
    verification: 'automated — evidence required: Tool schema definitions and validation test results'
    sources:
    - OWASP API Security Top 10 — API8 Security Misconfiguration

  - id: HE-014
    category: tool-boundaries
    threat: Rate limiting prevents tool abuse or resource exhaustion
    control: Tool invocations must be rate-limited per agent, per session, and globally. Limits must prevent
      both accidental loops and adversarial resource exhaustion.
    severity: high
    verification: 'automated — evidence required: Rate limit configuration and load test results'
    sources:
    - OWASP API Security Top 10 — API4 Unrestricted Resource Consumption
    - NIST SP 800-53 — SC-5 Denial of Service Protection

  - id: HE-015
    category: tool-boundaries
    threat: Tool error messages do not leak internal system details
    control: Error responses from tools must be sanitized before being returned to the agent. Stack traces,
      file paths, and database details must be stripped or generalized.
    severity: medium
    verification: 'automated — evidence required: Error handling configuration and fuzzing test results'
    sources:
    - OWASP Top 10 — A05 Security Misconfiguration


  # ── Runtime Controls & Limits ──────────────────────────────────────

  - id: HE-016
    category: runtime-controls
    threat: Execution timeout prevents runaway agent loops
    control: Every agent session must have a hard execution timeout. The harness must terminate the agent
      and rollback partial changes if the timeout is exceeded.
    severity: critical
    verification: 'automated — evidence required: Timeout configuration and timeout-recovery test results'
    sources:
    - NIST SP 800-53 — SC-5 Denial of Service Protection

  - id: HE-017
    category: runtime-controls
    threat: Token and cost budgets enforced per session
    control: Each session must have a maximum token budget and estimated cost budget. The harness must abort
      the session if either budget is exhausted.
    severity: high
    verification: 'automated — evidence required: Budget configuration and budget-exhaustion test results'
    sources:
    - OWASP LLM Top 10 — LLM10 Unbounded Consumption

  - id: HE-018
    category: runtime-controls
    threat: Rollback mechanism reverses partial actions on failure
    control: If an agent session fails or is terminated, the harness must be able to roll back any partial
      changes made by the agent to restore system state.
    severity: high
    verification: 'manual_review — evidence required: Rollback procedure documentation and failure-recovery
      test results'
    sources:
    - NIST SP 800-53 — CP-10 System Recovery
    - OWASP LLM Top 10 — LLM06 Excessive Agency

  - id: HE-019
    category: runtime-controls
    threat: Agent actions are logged with full provenance
    control: Every tool call, decision, and output must be logged with the agent identity, session ID, timestamp,
      input, and output. Logs must be tamper-evident.
    severity: medium
    verification: 'automated — evidence required: Logging configuration and log integrity verification results'
    sources:
    - NIST SP 800-53 — AU-2 Audit Events
    - NIST SP 800-53 — AU-10 Non-repudiation

  - id: HE-020
    category: runtime-controls
    threat: Circuit breakers halt repeated failures across sessions
    control: The harness must implement circuit breakers that prevent new sessions when failure rates exceed
      defined thresholds, preventing cascading failures.
    severity: medium
    verification: 'automated — evidence required: Circuit breaker configuration and failure-injection test
      results'
    sources:
    - NIST SP 800-53 — SC-5 Denial of Service Protection


  # ── Observability & Monitoring ──────────────────────────────────────

  - id: HE-021
    category: observability
    threat: All agent-to-tool interactions are observable and traceable
    control: The harness must provide a complete, queryable record of every agent-to-tool interaction, including
      the reasoning that led to the call, the parameters, and the response.
    severity: critical
    verification: 'manual_review — evidence required: Observability architecture and sample trace output'
    sources:
    - NIST SP 800-53 — AU-2 Audit Events
    - OpenTelemetry specification

  - id: HE-022
    category: observability
    threat: Anomaly detection alerts on unusual agent behavior patterns
    control: Monitoring must detect anomalies such as repeated tool failures, unexpected tool combinations,
      elevated token usage, or deviation from baseline behavior patterns.
    severity: high
    verification: 'automated — evidence required: Anomaly detection rules and alert configuration'
    sources:
    - NIST SP 800-53 — SI-4 System Monitoring
    - OWASP LLM Top 10 — LLM10 Unbounded Consumption

  - id: HE-023
    category: observability
    threat: Dashboards display real-time agent safety and health metrics
    control: Operations teams must have real-time dashboards showing active sessions, tool call rates, error
      rates, budget consumption, and safety flags.
    severity: high
    verification: 'manual_review — evidence required: Dashboard screenshots or configuration'
    sources:
    - NIST SP 800-53 — SI-4 System Monitoring

  - id: HE-024
    category: observability
    threat: Incident response playbook covers agent safety events
    control: A documented incident response playbook must exist specifically for agent-related safety events,
      including prompt injection, data exfiltration, and unauthorized tool use.
    severity: medium
    verification: 'manual_review — evidence required: Incident response playbook document'
    sources:
    - NIST SP 800-61 — Incident Handling
    - OWASP LLM Top 10

  - id: HE-025
    category: observability
    threat: Regular audit reviews of agent behavior logs
    control: Agent behavior logs must be reviewed on a defined schedule. Reviews must look for policy violations,
      emerging threats, and opportunities to tighten controls.
    severity: medium
    verification: 'manual_review — evidence required: Audit schedule and most recent audit report'
    sources:
    - NIST SP 800-53 — AU-6 Audit Review and Analysis
    - NIST SP 800-53 — CA-2 Security Assessments

