# System Hardening Checklist
# Validates infrastructure and host-level security for AI harness deployments


metadata:
  id: system-hardening
  name: System Hardening Checklist
  version: 1.0.0
  description: 'Validates infrastructure and host-level security for AI harness deployments. Covers OS
    hardening, network security, access control, container security, and cryptographic controls.

    '
  categories:
  - id: os-hardening
    name: OS Hardening
    weight: 30
  - id: network-security
    name: Network Security
    weight: 25
  - id: access-control
    name: Access Control & Identity
    weight: 25
  - id: container-security
    name: Container & Runtime Security
    weight: 20
checklist:

  # ── OS Hardening ──────────────────────────────────────

  - id: SH-001
    category: os-hardening
    threat: Minimal base image with no unnecessary packages installed
    control: The host or container base image must include only packages required for the harness workload.
      Development tools, debuggers, and unnecessary services must be removed.
    severity: critical
    verification: 'automated — evidence required: Image build Dockerfile and package audit scan results'
    sources:
    - CIS Benchmark — OS Hardening
    - NIST SP 800-123 — Server Security

  - id: SH-002
    category: os-hardening
    threat: Filesystem integrity monitoring enabled
    control: Critical system files and configuration directories must be monitored for unauthorized changes
      using file integrity monitoring (FIM) tools such as AIDE, Tripwire, or OS-level checksums.
    severity: critical
    verification: 'automated — evidence required: FIM configuration and baseline integrity report'
    sources:
    - NIST SP 800-53 — SI-7 Software Integrity
    - CIS Benchmark — Filesystem Integrity

  - id: SH-003
    category: os-hardening
    threat: Kernel parameters hardened via sysctl
    control: 'Kernel parameters must be set to harden the system: disable IP forwarding unless required, enable
      SYN cookies, disable source routing, and restrict core dumps.'
    severity: high
    verification: 'automated — evidence required: sysctl configuration file and verification script output'
    sources:
    - CIS Benchmark — Kernel Parameters
    - NIST SP 800-53 — SC-3 Security Function Isolation

  - id: SH-004
    category: os-hardening
    threat: Unnecessary services and daemons disabled
    control: Only services required for the harness must be enabled. SSH, cron, and other common services
      must be disabled or tightly restricted if not strictly needed.
    severity: high
    verification: 'automated — evidence required: Service audit results showing only required services active'
    sources:
    - CIS Benchmark — Service Configuration
    - NIST SP 800-123 — Server Security

  - id: SH-005
    category: os-hardening
    threat: File permissions follow principle of least privilege
    control: All files, especially configuration files and secrets, must have restrictive permissions. World-readable
      and world-writable files must be eliminated. SUID/SGID binaries must be audited and minimized.
    severity: high
    verification: 'automated — evidence required: Permission audit scan results and SUID/SGID inventory'
    sources:
    - NIST SP 800-53 — AC-3 Access Enforcement
    - CIS Benchmark — File Permissions

  - id: SH-006
    category: os-hardening
    threat: Secure boot chain verified
    control: Where supported, UEFI Secure Boot must be enabled. Boot parameters must restrict module loading
      and protect the boot chain from tampering.
    severity: medium
    verification: 'manual_review — evidence required: Secure Boot status verification and boot parameter documentation'
    sources:
    - NIST SP 800-53 — SI-6 Security Function Verification
    - UEFI Secure Boot specification


  # ── Network Security ──────────────────────────────────────

  - id: SH-007
    category: network-security
    threat: Default-deny firewall policy on all interfaces
    control: All network interfaces must use a default-deny firewall policy. Only explicitly required ports
      and services may be allowed through ingress and egress rules.
    severity: critical
    verification: 'automated — evidence required: Firewall rule set and policy audit results'
    sources:
    - NIST SP 800-53 — SC-7 Boundary Protection
    - CIS Benchmark — Firewall Configuration

  - id: SH-008
    category: network-security
    threat: TLS 1.2+ enforced for all communications
    control: All network communications — API calls, agent-to-harness, harness-to- tool, and dashboard access
      — must use TLS 1.2 or higher. TLS 1.0 and 1.1 must be disabled.
    severity: critical
    verification: 'automated — evidence required: TLS configuration and SSL Labs scan results'
    sources:
    - NIST SP 800-52r2 — TLS Guidelines
    - CIS Benchmark — TLS Configuration

  - id: SH-009
    category: network-security
    threat: Mutual TLS or token-based authentication between services
    control: Inter-service communication within the harness stack must use mutual TLS (mTLS) or short-lived
      tokens with rotation. No unauthenticated internal endpoints.
    severity: high
    verification: 'automated — evidence required: mTLS or token configuration and inter-service auth test
      results'
    sources:
    - NIST SP 800-53 — IA-9 Service Identification
    - OWASP API Security — API1 Broken Object-Level Authorization

  - id: SH-010
    category: network-security
    threat: DNS resolution restricted to approved resolvers
    control: Agent and harness workloads must use approved DNS resolvers. DNS-over- HTTPS or DNS-over-TLS
      is preferred. Wildcard or public DNS must not be used for internal resolution.
    severity: high
    verification: 'automated — evidence required: DNS resolver configuration and resolution test results'
    sources:
    - NIST SP 800-53 — SC-7 Boundary Protection
    - CIS Benchmark — DNS Configuration

  - id: SH-011
    category: network-security
    threat: Network segmentation isolates harness from production
    control: The harness environment must be in a separate network segment from production workloads. Network
      policies must prevent lateral movement between segments.
    severity: medium
    verification: 'manual_review — evidence required: Network topology diagram and segmentation policy'
    sources:
    - NIST SP 800-53 — SC-7 Boundary Protection
    - CIS Benchmark — Network Segmentation


  # ── Access Control & Identity ──────────────────────────────────────

  - id: SH-012
    category: access-control
    threat: Role-based access control enforced for all harness users
    control: Access to the harness dashboard, API, and configuration must be governed by role-based access
      control (RBAC). No shared or generic accounts.
    severity: critical
    verification: 'automated — evidence required: RBAC policy configuration and access review results'
    sources:
    - NIST SP 800-53 — AC-2 Account Management
    - OWASP ASVS — V1 Access Control

  - id: SH-013
    category: access-control
    threat: Multi-factor authentication required for administrative access
    control: All administrative access to the harness — dashboard, API, SSH, and configuration management
      — must require multi-factor authentication (MFA).
    severity: critical
    verification: 'manual_review — evidence required: MFA configuration and enforcement verification'
    sources:
    - NIST SP 800-53 — IA-2 Identification and Authentication
    - NIST SP 800-63B — Digital Identity Guidelines

  - id: SH-014
    category: access-control
    threat: Service accounts use short-lived credentials with rotation
    control: All service accounts used by the harness or agent must use short-lived credentials (e.g., tokens
      with TTL ≤ 1 hour). Credentials must be rotated automatically. No long-lived API keys.
    severity: high
    verification: 'automated — evidence required: Service account credential configuration and rotation logs'
    sources:
    - NIST SP 800-53 — IA-5 Authenticator Management
    - OWASP ASVS — V2 Authentication

  - id: SH-015
    category: access-control
    threat: Privileged operations require approval workflow
    control: Any operation that modifies harness configuration, deploys new agents, or accesses sensitive
      data must go through an approval workflow with at least one additional reviewer.
    severity: high
    verification: 'manual_review — evidence required: Approval workflow configuration and recent audit trail'
    sources:
    - NIST SP 800-53 — AC-3 Access Enforcement
    - OWASP ASVS — V1 Architecture

  - id: SH-016
    category: access-control
    threat: Session timeouts and idle disconnect enforced
    control: Dashboard and API sessions must have configurable timeouts. Idle sessions must be disconnected
      after a defined period. No indefinite sessions.
    severity: medium
    verification: 'automated — evidence required: Session timeout configuration and test results'
    sources:
    - NIST SP 800-53 — AC-12 Session Termination
    - OWASP ASVS — V3 Session Management


  # ── Container & Runtime Security ──────────────────────────────────────

  - id: SH-017
    category: container-security
    threat: Containers run as non-root with dropped capabilities
    control: All harness and agent containers must run as non-root users with all Linux capabilities dropped
      except those explicitly required. No privileged containers in production.
    severity: critical
    verification: 'automated — evidence required: Container security policy and runtime scan results'
    sources:
    - CIS Docker Benchmark — Container Runtime
    - NIST SP 800-190 — Container Security

  - id: SH-018
    category: container-security
    threat: Read-only root filesystem for agent containers
    control: Agent containers must use a read-only root filesystem. Any writable paths must be explicitly
      declared as tmpfs or volume mounts.
    severity: high
    verification: 'automated — evidence required: Container filesystem configuration and verification'
    sources:
    - CIS Docker Benchmark — Container Runtime
    - NIST SP 800-190 — Container Security

  - id: SH-019
    category: container-security
    threat: Container images scanned for vulnerabilities before deployment
    control: All container images must pass vulnerability scanning before deployment. Critical and high CVEs
      must be resolved or formally accepted before the image is promoted to production.
    severity: high
    verification: 'automated — evidence required: Vulnerability scan reports and exception tracking'
    sources:
    - NIST SP 800-190 — Container Security
    - CIS Benchmark — Image Scanning

  - id: SH-020
    category: container-security
    threat: Seccomp and AppArmor profiles applied to all containers
    control: Every container must run under a seccomp profile that blocks unnecessary syscalls and an AppArmor
      profile that restricts file and capability access. Default Docker profiles are not sufficient.
    severity: medium
    verification: 'automated — evidence required: Seccomp and AppArmor profile configurations and test results'
    sources:
    - CIS Docker Benchmark — Container Runtime
    - NIST SP 800-190 — Container Security

  - id: SH-021
    category: container-security
    threat: Container resource limits prevent resource exhaustion
    control: Every container must have CPU and memory limits set. No container may request unlimited resources.
      Limits must prevent a single agent from exhausting host resources.
    severity: medium
    verification: 'automated — evidence required: Resource limit configuration and stress test results'
    sources:
    - NIST SP 800-53 — SC-5 Denial of Service Protection
    - CIS Docker Benchmark — Resource Limits

