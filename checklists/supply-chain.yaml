# Supply Chain Checklist
# Validates supply chain security for AI harness components and dependencies


metadata:
  id: supply-chain
  name: Supply Chain Checklist
  version: 1.0.0
  description: 'Validates supply chain security for AI harness components and dependencies. Covers dependency
    management, provenance and integrity, build pipeline security, model supply chain, and incident response.

    '
  categories:
  - id: dependency-management
    name: Dependency Management
    weight: 30
  - id: provenance-integrity
    name: Provenance & Integrity
    weight: 25
  - id: build-pipeline
    name: Build Pipeline Security
    weight: 20
  - id: model-supply-chain
    name: Model Supply Chain
    weight: 15
  - id: incident-response
    name: Incident Response & Recovery
    weight: 10
checklist:

  # ── Dependency Management ──────────────────────────────────────

  - id: SC-001
    category: dependency-management
    threat: Complete Software Bill of Materials (SBOM) maintained
    control: A complete SBOM must be generated and maintained for all harness components, including transitive
      dependencies. SBOM must be in a machine-readable format (CycloneDX or SPDX).
    severity: critical
    verification: 'automated — evidence required: SBOM file in CycloneDX or SPDX format and generation pipeline
      configuration'
    sources:
    - NIST SP 800-161r1 — Cybersecurity Supply Chain Risk Management
    - EO 14028 — Software Bill of Materials

  - id: SC-002
    category: dependency-management
    threat: Automated vulnerability scanning of all dependencies
    control: All dependencies must be scanned for known vulnerabilities using automated tools (e.g., OSV,
      Snyk, Trivy). Scans must run on every build and nightly. Critical and high CVEs must be resolved or
      formally accepted within SLA.
    severity: critical
    verification: 'automated — evidence required: Vulnerability scan results and remediation tracking'
    sources:
    - NIST SP 800-53 — RA-5 Vulnerability Scanning
    - NIST SP 800-53 — SI-2 Flaw Remediation

  - id: SC-003
    category: dependency-management
    threat: Dependency versions pinned with integrity hashes
    control: All dependency versions must be pinned to exact versions with integrity hashes (SHA-256). No
      floating version ranges in production lock files. Hash verification must be enforced at install time.
    severity: high
    verification: 'automated — evidence required: Lock file with integrity hashes and verification script
      output'
    sources:
    - SLSA Framework — Build Level 2
    - NIST SP 800-161r1 — Supply Chain Risk Management

  - id: SC-004
    category: dependency-management
    threat: Private dependency registry or mirror used
    control: Production builds must pull dependencies from a private registry or verified mirror, not directly
      from public registries. This prevents dependency confusion and typosquatting attacks.
    severity: high
    verification: 'manual_review — evidence required: Private registry configuration and dependency resolution
      logs'
    sources:
    - OWASP Supply Chain — Dependency Confusion
    - NIST SP 800-161r1 — Supply Chain Risk Management

  - id: SC-005
    category: dependency-management
    threat: Unused and unnecessary dependencies removed
    control: The dependency tree must be regularly audited to remove unused, deprecated, or unmaintained packages.
      Every dependency must have a clear justification for inclusion.
    severity: medium
    verification: 'automated — evidence required: Dependency audit report and removal evidence'
    sources:
    - NIST SP 800-53 — CM-7 Least Functionality
    - OWASP Supply Chain — Dependency Management


  # ── Provenance & Integrity ──────────────────────────────────────

  - id: SC-006
    category: provenance-integrity
    threat: Build provenance attestation for all release artifacts
    control: Every release artifact must have a signed provenance attestation (SLSA provenance) that records
      how it was built, from what sources, and by what builder. Attestations must be verifiable.
    severity: critical
    verification: 'automated — evidence required: SLSA provenance attestations and verification script output'
    sources:
    - SLSA Framework — Build Level 3
    - in-toto specification

  - id: SC-007
    category: provenance-integrity
    threat: Code signing enforced for all release artifacts
    control: All release artifacts — binaries, containers, and packages — must be signed with a code-signing
      key managed in a hardware security module (HSM) or equivalent. Signatures must be verified before deployment.
    severity: critical
    verification: 'manual_review — evidence required: Code signing configuration and verification procedure'
    sources:
    - SLSA Framework — Build Level 3
    - NIST SP 800-53 — SC-12 Cryptographic Key Management

  - id: SC-008
    category: provenance-integrity
    threat: Container image signatures verified before deployment
    control: Container images must be signed during build and verified before deployment. Unsigned or tampered
      images must be rejected by the deployment pipeline and runtime.
    severity: high
    verification: 'automated — evidence required: Image signing configuration and admission controller policy'
    sources:
    - SLSA Framework — Build Level 3
    - Sigstore Cosign documentation

  - id: SC-009
    category: provenance-integrity
    threat: Git commit signing and branch protection enforced
    control: All commits to protected branches must be signed. Branch protection must require signed commits,
      passing CI, and at least one reviewer. No force pushes allowed.
    severity: high
    verification: 'automated — evidence required: Repository branch protection settings and commit signing
      configuration'
    sources:
    - SLSA Framework — Source Level 3
    - NIST SP 800-53 — CM-5 Change Restrictions

  - id: SC-010
    category: provenance-integrity
    threat: Reproducible builds verified for critical components
    control: Critical components must build reproducibly — the same source must produce bit-for-bit identical
      artifacts when built twice. Non- reproducible builds must be investigated and documented.
    severity: medium
    verification: 'manual_review — evidence required: Reproducibility verification results and any exception
      documentation'
    sources:
    - SLSA Framework — Build Level 3
    - Reproducible Builds specification


  # ── Build Pipeline Security ──────────────────────────────────────

  - id: SC-011
    category: build-pipeline
    threat: CI/CD pipeline runs in hardened ephemeral environments
    control: Build pipelines must run in ephemeral, hardened environments. No persistent build agents. Build
      environments must be destroyed after each build to prevent cache poisoning.
    severity: critical
    verification: 'automated — evidence required: CI/CD configuration showing ephemeral runner setup'
    sources:
    - SLSA Framework — Build Level 2
    - NIST SP 800-53 — CM-2 Baseline Configuration

  - id: SC-012
    category: build-pipeline
    threat: Pipeline secrets injected, never embedded in configuration
    control: Build pipeline secrets (tokens, signing keys, deploy credentials) must be injected from a secrets
      manager at runtime. Secrets must never appear in pipeline configuration files, environment variables
      in logs, or build artifacts.
    severity: high
    verification: 'automated — evidence required: Pipeline secret configuration and secret scan results'
    sources:
    - OWASP Top 10 — A02 Cryptographic Failures
    - NIST SP 800-53 — SC-12 Cryptographic Key Management

  - id: SC-013
    category: build-pipeline
    threat: Build pipeline changes require review and approval
    control: All changes to CI/CD pipeline configuration must go through code review and approval. Pipeline-as-code
      files must be in protected branches with required reviews.
    severity: high
    verification: 'manual_review — evidence required: Pipeline change approval workflow and recent approval
      records'
    sources:
    - NIST SP 800-53 — CM-3 Configuration Change Control
    - SLSA Framework — Source Level 2


  # ── Model Supply Chain ──────────────────────────────────────

  - id: SC-014
    category: model-supply-chain
    threat: Model weights verified against published checksums
    control: All model weights downloaded from external sources must be verified against published SHA-256
      checksums before use. Checksums must come from the model publisher's official channel.
    severity: critical
    verification: 'automated — evidence required: Checksum verification script and verification logs'
    sources:
    - NIST AI RMF — MAP 1.1
    - SLSA Framework — Build Level 1

  - id: SC-015
    category: model-supply-chain
    threat: Model provenance and training data transparency documented
    control: 'For each model used, documentation must exist covering: model origin, training data sources,
      known limitations, safety evaluations performed, and any modifications made since original publication.'
    severity: critical
    verification: 'manual_review — evidence required: Model card documentation and provenance records'
    sources:
    - NIST AI RMF — MAP 1.1
    - Model Cards for Model Reporting — Mitchell et al.

