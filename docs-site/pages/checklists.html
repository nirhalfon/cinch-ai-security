<script src="../js/app.js"></script>
<script>
(async function() {
  const app = document.getElementById('app');
  const page = app.dataset.page;
  const params = new URLSearchParams(window.location.search);
  const key = params.get('key') || '';
  const d = await loadData();
  const renderer = PAGES[page];
  if (renderer) {
    const html = await renderer(key);
    app.innerHTML = html;
    document.querySelectorAll('#severity-filter .filter-btn')?.forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#severity-filter .filter-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const sev = btn.dataset.sev;
        document.querySelectorAll('.checklist-item').forEach(item => {
          const tag = item.querySelector('.tag-critical,.tag-high,.tag-medium,.tag-low');
          const itemSev = tag ? tag.textContent.trim().toLowerCase() : '';
          item.style.display = (sev==='all' || itemSev===sev) ? '' : 'none';
        });
      });
    });
    const clTabs = document.getElementById('cl-tabs');
    if (clTabs) {
      clTabs.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', async () => {
          clTabs.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById('cl-content').innerHTML = renderChecklistPage(tab.dataset.cl, d.checklists[tab.dataset.cl]);
        });
      });
    }
  }
})();
document.getElementById('menu-toggle')?.addEventListener('click', () => {
  document.getElementById('nav-links').classList.toggle('open');
});
</script>
</body></html>
